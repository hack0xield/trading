# Provisional ZigZag candidate -> MZ50 crossing -> MZ100.
#
#   scripts/run_backtest.py --config configs/strategies/mz50.yaml --save
#
# Specification: impl-spec/Provisional_ZigZag_MZ50_Strategy_Spec.md. The zone
# hangs off the provisional ZigZag candidate, so it is knowable immediately;
# every strict extension freezes a new version, and a crossing counts only when
# both rollover observations were measured against the same one. Entry is a
# True crossing of MZ50 toward the zone, target MZ100, stop mirrored about the
# fill. `place_orders: false` runs the same pass with the trading rule off.

strategy: mz50
symbol: EURUSD
timeframe: H4              # the zones and the ZigZag are H4

data: parquet://data/bars
start: 2022-01-01
# end: 2024-12-31          # uncommented, this holds 2025+ back as out-of-sample

params:
  volume: 0.1

  # --- the zones ---------------------------------------------------------
  contract: 6E             # margin comes from Euro FX futures; EUR/USD CFD is traded
  deviation_pct: 2.0       # retracement that confirms a ZigZag pivot, as a % of
                           # the extreme's price — ~220 pips on EUR/USD at 1.10.
                           # Higher: fewer, larger swings, confirmed later.
  initial_ratio: 1.1

  # --- the observations --------------------------------------------------
  rollover_hour: 0         # the daily CFD break. On H4 the 20:00 bar closes
  rollover_tz: UTC         # exactly here, so its close is the rollover price.
  max_gap_days: 3          # a weekend collapses into 2-3 calendar days; wider
                           # than this is treated as missing data, and no
                           # crossing is formed across it.

  # --- the trading -------------------------------------------------------
  place_orders: true       # false = draw the support components, trade nothing
  signal_level: mz50       # which level a crossing must cross to signal.
                           # mz50 — the zone's midpoint, anchor +- (dFMZ+dIMZ)/2
                           # — is the specification's entry. e50 sits at half
                           # that distance from the anchor: crossed far more
                           # often (167 against 16 here) and risking roughly
                           # 20x as much per trade, since the stop mirrors the
                           # distance to MZ100. Both levels are recorded on
                           # every zone version whichever one is traded.
  variant: KEEP_OPEN       # or CLOSE_ON_CANDIDATE_UPDATE. The only difference is
                           # whether a later strict extension of the originating
                           # candidate closes an open trade.

execution:
  initial_balance: 100000
  leverage: 100
  slippage_points: 0
  commission_per_lot: 0
  apply_swap: true
  intrabar: conservative   # a bar holding both stop and target resolves as the stop
