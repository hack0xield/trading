# Provisional ZigZag candidate -> E50 crossing -> near margin zone.
#
#   scripts/run_backtest.py --config configs/strategies/mz50.yaml --save
#
# Specification: impl-spec/[1 Sep5]E50_NearTP_OriginalSL_TwoCloseExit_Spec.md.
# The zone hangs off the provisional ZigZag candidate, so it is knowable
# immediately; every strict extension freezes a new version, and a crossing
# counts only when both daily observations were measured against the same one.
# Entry is a True crossing of E50 toward the zone, target MZ0, stop
# 2*entry - MZ100. `place_orders: false` runs the same pass with the rule off.

strategy: mz50
symbol: EURUSD
timeframe: H4              # the zones and the ZigZag are H4

data: parquet://data/bars
start: 2022-01-01
# end: 2024-12-31          # uncommented, this holds 2025+ back as out-of-sample

params:
  volume: 0.1

  # --- the zones ---------------------------------------------------------
  contract: 6E             # margin comes from Euro FX futures; EUR/USD CFD is traded
  deviation_pct: 2.0       # retracement that confirms a ZigZag pivot, as a % of
                           # the extreme's price — ~220 pips on EUR/USD at 1.10.
                           # Higher: fewer, larger swings, confirmed later.
  initial_ratio: 1.1

  # --- the observations --------------------------------------------------
  rollover_hour: 0         # the daily CFD break. On H4 the 20:00 bar closes
  rollover_tz: UTC         # exactly here, so its close is the rollover price.
  max_gap_days: 3          # a weekend collapses into 2-3 calendar days; wider
                           # than this is treated as missing data, and no
                           # crossing is formed across it.

  # --- the trading -------------------------------------------------------
  place_orders: true       # false = draw the support components, trade nothing
  take_profit: mz0         # the near boundary. mz100 is the far one, and the
                           # stop stays 2*entry - mz100 either way, so aiming
                           # near lowers the planned reward-to-risk below 1
                           # rather than moving the stop.
  two_close_exit: true     # leave after two consecutive daily closes back past
                           # the trade's own e50, on the anchor's side. The
                           # first warns, the second confirms, and the exit
                           # fills at the next open. A close on the zone side,
                           # exactly on e50, or a break in the daily sequence
                           # clears the warning.
  variant: KEEP_OPEN       # the specification's runs are all KEEP_OPEN.
                           # CLOSE_ON_CANDIDATE_UPDATE additionally closes when
                           # the originating candidate extends against the trade.

# The specification's comparison runs, from this same config:
#   A  -p take_profit=mz100 -p two_close_exit=false
#   B  -p take_profit=mz0   -p two_close_exit=false
#   C  as configured below

execution:
  initial_balance: 100000
  leverage: 100
  slippage_points: 0
  commission_per_lot: 0
  apply_swap: true
  intrabar: conservative   # a bar holding both stop and target resolves as the stop
