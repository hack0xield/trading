# True 50% Crossing -> 100% MZ, as a reproducible run.
#
#   scripts/run_backtest.py --config configs/strategies/crossing50_eurusd.yaml --save
#
# The specification is impl-spec/Backtest Strategy(crossing50).pdf. Unlike the senior-
# extremum pattern it defines the trade as well as the signal, so there is
# very little here to choose: entry, target and stop all follow from the zone.

strategy: crossing50
symbol: EURUSD
timeframe: H4              # the zones and the ZigZag are H4

data: parquet://data/bars
start: 2022-01-01
# end: 2024-12-31          # uncommented, this holds 2025+ back as out-of-sample

params:
  volume: 0.1

  # --- the zones ---------------------------------------------------------
  contract: 6E             # margin comes from Euro FX futures; EUR/USD CFD is traded
  deviation_pct: 2.0       # retracement that confirms a ZigZag pivot, as a % of
                           # the extreme's price — ~220 pips on EUR/USD at 1.10.
                           # Higher: fewer, larger swings, confirmed later.
  initial_ratio: 1.1

  # --- the signal --------------------------------------------------------
  rollover_hour: 0         # the daily CFD break. On H4 the 20:00 bar closes
  rollover_tz: UTC         # exactly here, so its close is the rollover price.
  max_gap_days: 3          # a weekend collapses into 2-3 calendar days; wider
                           # than this is treated as missing data, and no
                           # crossing is created across it (spec §5).

  # --- the trading -------------------------------------------------------
  one_position: true       # one crossing at a time
  max_hold_bars: 0         # the spec has no time exit: hold to TP or SL
  trade: true              # false = detect only, still writes signals.csv

execution:
  initial_balance: 100000
  leverage: 100
  slippage_points: 0
  commission_per_lot: 0
  apply_swap: true
  intrabar: conservative   # a bar holding both stop and target resolves as the
                           # stop. With a 1:1 bracket this matters more than
                           # usual — the two are equidistant, so any bar wide
                           # enough to touch one often touches both.
